<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HNKG MARKET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0d0d1a; color: white; margin: 0; }
        .bg-grid {
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.03) 39px, rgba(255,255,255,0.03) 40px),
                repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.03) 39px, rgba(255,255,255,0.03) 40px);
        }
    </style>
</head>
<body class="bg-grid min-h-screen flex flex-col items-center justify-center px-4">
    <div class="max-w-lg w-full text-center">
        <h1 class="text-6xl font-black tracking-tighter uppercase mb-2 leading-none"
            style="background: linear-gradient(180deg, #fff 30%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            HNKG<br>MARKET
        </h1>
        <p class="text-gray-400 text-sm tracking-[0.2em] mb-12">ファンパレ・バウンティ 垢販売</p>

        <a href="dashboard.html" 
           class="block w-full py-5 rounded-2xl font-bold text-xl tracking-widest text-white transition-transform active:scale-95 shadow-lg"
           style="background: linear-gradient(90deg, #7c3aed, #ec4899);">
            在庫を見る
        </a>
    </div>
</body>
</html>
