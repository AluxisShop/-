<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shop</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white">

<h1 class="p-4 font-bold">🛒 商品一覧</h1>

<div id="list" class="p-4 grid md:grid-cols-3 gap-3"></div>

<script>
let data = JSON.parse(localStorage.getItem("db")||"[]");

function buy(price){
  window.location.href = "https://buy.stripe.com/test_xxx";
}

function render(){
  list.innerHTML="";

  data.forEach(i=>{
    list.innerHTML += `
      <div class="bg-gray-900 rounded-xl p-3">

        ${i.img ? `<img src="${i.img}" class="h-40 w-full object-cover rounded">` : ""}

        <div class="font-bold mt-2">${i.name}</div>
        <div class="text-sm text-gray-400">¥${i.price}</div>
        <div class="text-xs text-gray-500">在庫:${i.stock}</div>

        <button onclick="buy(${i.price})"
          class="w-full mt-3 bg-blue-600 p-2 rounded">
          購入する
        </button>

      </div>
    `;
  });
}

render();
</script>

</body>
</html>
