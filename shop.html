<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HNKG MARKET | ゲームアカウント販売</title><style>:root{--bg:#05060b;--panel:#0d111c;--line:#202a3c;--text:#f8fafc;--muted:#8d9ab0;--a:#a855f7;--b:#38bdf8;--ok:#34d399}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 10% -10%,#5b21b633,transparent 55%),radial-gradient(700px 450px at 100% 15%,#0284c733,transparent 55%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 0 24px}.brand{font-size:24px;font-weight:950;letter-spacing:.08em}.brand i{font-style:normal;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;color:transparent}.navlinks{display:flex;gap:9px}.navlinks a{color:var(--text);text-decoration:none;border:1px solid var(--line);background:#ffffff08;padding:9px 13px;border-radius:999px;font-size:13px}.hero{border:1px solid var(--line);border-radius:30px;padding:42px 30px;background:linear-gradient(135deg,#ffffff09,#ffffff03);box-shadow:0 30px 100px #0008}.eyebrow{color:#c4b5fd;font-size:12px;font-weight:800;letter-spacing:.18em}.hero h1{font-size:clamp(36px,6vw,70px);line-height:1;margin:13px 0}.hero h1 span{background:linear-gradient(90deg,#fff,#c4b5fd,#7dd3fc);-webkit-background-clip:text;color:transparent}.hero p{max-width:680px;color:var(--muted);line-height:1.8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat{padding:18px;border:1px solid var(--line);border-radius:20px;background:#ffffff04}.stat strong{display:block;font-size:25px}.stat small{color:var(--muted)}.toolbar{display:grid;grid-template-columns:1fr 190px 190px;gap:10px;margin:28px 0 15px}input,select{width:100%;background:#090d15;border:1px solid var(--line);color:var(--text);padding:13px 14px;border-radius:14px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:28px 0 14px}.sectionhead h2{margin:0}.sectionhead span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:linear-gradient(180deg,#111827,#0b0f18);border:1px solid var(--line);border-radius:23px;overflow:hidden;transition:.2s;box-shadow:0 18px 50px #0004}.card:hover{transform:translateY(-4px);border-color:#4c1d95}.thumb{height:165px;background:radial-gradient(circle at 25% 30%,#7c3aed55,transparent 35%),linear-gradient(135deg,#151b2b,#090d15);display:grid;place-items:center;color:#9aa8bd;position:relative}.tag{position:absolute;left:13px;top:13px;background:#fff;color:#09090b;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}.body{padding:17px}.game{color:#8dd8ff;font-size:12px;font-weight:800}.title{font-size:18px;font-weight:900;margin:6px 0 8px}.meta{display:flex;gap:7px;flex-wrap:wrap}.pill{font-size:11px;border:1px solid var(--line);padding:5px 8px;border-radius:999px;color:#b8c4d6}.price{font-size:23px;font-weight:950;margin:14px 0}.stock{font-size:12px;color:var(--ok)}.sold{color:#fb7185}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.btn{border:0;border-radius:12px;padding:12px;font-weight:900;cursor:pointer}.detail{background:#fff;color:#05060b}.dm{background:linear-gradient(135deg,var(--a),var(--b));color:white}.btn:disabled{opacity:.45}.empty{text-align:center;color:var(--muted);padding:50px}.notice{margin:24px 0;padding:18px;border:1px solid var(--line);border-radius:20px;color:var(--muted);line-height:1.8}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;padding:18px;align-items:center;justify-content:center}.modal.on{display:flex}.box{width:min(600px,100%);background:#0d111c;border:1px solid #303b50;border-radius:24px;padding:22px}.boxhead{display:flex;justify-content:space-between}.close{background:#ffffff0d;color:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.detailitem{border:1px solid var(--line);border-radius:14px;padding:13px}.detailitem small{display:block;color:var(--muted);font-size:11px}.detailitem strong{display:block;margin-top:4px}.modal .dm{width:100%}footer{padding:45px 0 20px;color:#69758a;text-align:center;font-size:12px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}}@media(max-width:560px){.stats,.grid,.toolbar{grid-template-columns:1fr}.toolbar input{grid-column:auto}.hero{padding:32px 20px}}</style></head><body><div class="wrap"><header class="nav"><div class="brand">HNKG <i>MARKET</i></div><nav class="navlinks"><a href="#products">商品一覧</a><a href="index.html">管理画面</a></nav></header><section class="hero"><div class="eyebrow">PREMIUM GAME ACCOUNT MARKET</div><h1>欲しいアカウントを<br><span>すぐに見つける。</span></h1><p>厳選したゲームアカウントを見やすく掲載。商品IDを確認して、そのまま購入相談まで進めます。</p></section><section class="stats"><div class="stat"><strong id="count">0</strong><small>公開商品</small></div><div class="stat"><strong id="games">0</strong><small>取扱ゲーム</small></div><div class="stat"><strong>ONLINE</strong><small>現在対応中</small></div></section><div class="toolbar"><input id="q" placeholder="商品名・ゲーム名で検索"><select id="cat"><option value="all">すべてのゲーム</option></select><select id="sort"><option value="new">おすすめ順</option><option value="low">価格が安い順</option><option value="high">価格が高い順</option></select></div><section id="products"><div class="sectionhead"><h2>在庫一覧</h2><span id="result"></span></div><div id="list" class="grid"></div><div id="empty" class="empty" hidden>条件に一致する商品がありません。</div></section><div class="notice"><b>購入について</b><br>購入前に商品内容・注意事項をご確認ください。購入ボタンからDMへ進み、商品IDを伝えるだけでスムーズに案内できます。</div><footer>© HNKG MARKET — GAME ACCOUNT STORE</footer></div><div id="modal" class="modal"><div class="box"><div class="boxhead"><div><div class="eyebrow">PRODUCT DETAIL</div><h2 id="mTitle" style="margin:6px 0"></h2></div><button class="close" onclick="closeModal()">閉じる</button></div><div id="mBody"></div><a id="mDm" class="btn dm" style="display:block;text-align:center;text-decoration:none" target="_blank">この商品を購入相談する</a></div></div><script>const sample=[{id:'HNKG-001',name:'五条完凸アカウント',game:'ファンパレ',rank:'SSS',price:7980,stock:1,status:'販売中',memo:'PICK UP'},{id:'HNKG-002',name:'ニカルフィ所持アカウント',game:'バウンティ',rank:'SS',price:4980,stock:2,status:'販売中',memo:'即納可'},{id:'HNKG-003',name:'高レア限定キャラ多数',game:'モンスト',rank:'SSS',price:12800,stock:1,status:'販売中',memo:'限定キャラ多数'},{id:'HNKG-004',name:'石大量アカウント',game:'FGO',rank:'SS',price:6980,stock:3,status:'販売中',memo:'石重視'},{id:'HNKG-005',name:'環境選手多数',game:'プロスピ',rank:'SSS',price:9800,stock:1,status:'販売中',memo:'即戦力'},{id:'HNKG-006',name:'SSR券・チケット充実',game:'ファンパレ',rank:'SS',price:3500,stock:2,status:'販売中',memo:'初心者おすすめ'}];const data=JSON.parse(localStorage.getItem('hnkg_inventory')||'null')||sample;let visible=data.filter(x=>x.status!=='非公開');const yen=n=>Number(n||0).toLocaleString('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0});const esc=s=>String(s??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const cat=document.querySelector('#cat');[...new Set(visible.map(x=>x.game))].sort().forEach(g=>cat.insertAdjacentHTML('beforeend',`<option>${esc(g)}</option>`));function render(){let q=document.querySelector('#q').value.trim().toLowerCase(),c=cat.value,s=document.querySelector('#sort').value;let a=visible.filter(x=>(!q||(x.name+x.game+x.memo).toLowerCase().includes(q))&&(c==='all'||x.game===c));if(s==='low')a.sort((x,y)=>x.price-y.price);if(s==='high')a.sort((x,y)=>y.price-x.price);document.querySelector('#count').textContent=visible.length;document.querySelector('#games').textContent=new Set(visible.map(x=>x.game)).size;document.querySelector('#result').textContent=`${a.length}件`;document.querySelector('#empty').hidden=a.length>0;document.querySelector('#list').innerHTML=a.map(x=>`<article class="card"><div class="thumb"><span class="tag">${esc(x.rank)}</span>${esc(x.game)}</div><div class="body"><div class="game">${esc(x.game)}</div><div class="title">${esc(x.name)}</div><div class="meta"><span class="pill">ID ${esc(x.id)}</span><span class="pill">${esc(x.memo||'即納可')}</span></div><div class="price">${yen(x.price)}</div><div class="${x.stock>0?'stock':'sold'}">${x.stock>0?'● 在庫あり — 残り'+x.stock+'件':'● SOLD OUT'}</div><div class="actions"><button class="btn detail" onclick="openModal('${esc(x.id)}')">詳細を見る</button><button class="btn dm" ${x.stock<=0?'disabled':''} onclick="buy('${esc(x.id)}')">購入相談</button></div></div></article>`).join('')}function get(id){return visible.find(x=>x.id===id)}function dmUrl(id){return 'https://x.com/intent/post?text='+encodeURIComponent('HNKG MARKETの商品「'+id+'」を購入希望です。')}function openModal(id){let x=get(id);if(!x)return;document.querySelector('#mTitle').textContent=x.name;document.querySelector('#mBody').innerHTML=`<div class="detailgrid"><div class="detailitem"><small>商品ID</small><strong>${esc(x.id)}</strong></div><div class="detailitem"><small>ゲーム</small><strong>${esc(x.game)}</strong></div><div class="detailitem"><small>ランク</small><strong>${esc(x.rank)}</strong></div><div class="detailitem"><small>価格</small><strong>${yen(x.price)}</strong></div><div class="detailitem"><small>在庫</small><strong>${x.stock}件</strong></div><div class="detailitem"><small>備考</small><strong>${esc(x.memo||'—')}</strong></div></div>`;document.querySelector('#mDm').href=dmUrl(x.id);document.querySelector('#modal').classList.add('on')}function closeModal(){document.querySelector('#modal').classList.remove('on')}function buy(id){location.href=dmUrl(id)}document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.querySelector('#q').addEventListener('input',render);cat.addEventListener('change',render);document.querySelector('#sort').addEventListener('change',render);render();</script></body></html>
