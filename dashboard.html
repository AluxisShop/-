<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HNKG MARKET - DASHBOARD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&family=Noto+Sans+JP:wght@900&display=swap');
        body { 
            background: #0d0d1a; 
            color: white; 
            font-family: 'Inter', 'Noto Sans JP', sans-serif; 
            margin: 0;
        }
        .bg-grid {
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-attachment: fixed;
        }
        .glass-card {
    position: relative;
    overflow: hidden;

    background:
    linear-gradient(135deg,
    rgba(168,85,247,0.18),
    rgba(59,130,246,0.08));

    border: 1px solid rgba(255,255,255,0.08);

    border-radius: 1.7rem;

    backdrop-filter: blur(18px);

    box-shadow:
    0 0 25px rgba(168,85,247,0.12),
    inset 0 0 20px rgba(255,255,255,0.03);
}

.glass-card::before{
    content: "";

    position: absolute;
    top: 0;
    left: -60%;

    width: 40%;
    height: 100%;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.08),
        transparent
    );

    transform: skewX(-20deg);

    animation: shine 5s infinite;
}

@keyframes shine{
    0%{
        left: -60%;
    }

    100%{
        left: 130%;
    }
}

        .item-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(192, 132, 252, 0.15);
            border-radius: 1.2rem;
            overflow: hidden; /* 動画のはみ出し防止 */
        }
        /* 動画プレイヤーのスタイル */
        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            border-bottom: 1px solid rgba(192, 132, 252, 0.15);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        ::-webkit-scrollbar { display: none; }
        .video-container iframe{
    width:100%;
    height:100%;
}
    </style>
</head>
<body class="bg-grid">
    <div class="max-w-md mx-auto px-5 pt-8 pb-12 space-y-6">
        
        <div>
            <h1 class="text-3xl font-black tracking-tighter italic uppercase">HNKGMARKET</h1>
            <p class="text-gray-500 text-[10px] tracking-widest font-bold">ファンパレ・バウンティ 垢販売</p>
        </div>

        <div class="flex gap-2">
    <button
        id="fanpareBtn"
        onclick="showSection('fanpare')"
        class="flex-1 py-3 rounded-full text-xs font-black bg-purple-900/40 border border-purple-500 text-purple-200">
        ファンパレ
    </button>

    <button
        id="bountyBtn"
        onclick="showSection('bounty')"
        class="flex-1 py-3 rounded-full text-xs font-black bg-white/5 border border-white/10 text-gray-500 uppercase">
        バウンティ
    </button>
</div>

        <div class="grid grid-cols-2 gap-3">
            <div class="glass-card p-4">
                <p class="text-[10px] text-gray-500 font-black tracking-widest">LIVE STOCK</p>
                <p class="text-4xl font-black mt-1">

        10
        </p>
            </div>
            <div class="glass-card p-4">
                <p class="text-[10px] text-gray-500 font-black tracking-widest">ONLINE USERS</p>
                <p id="onlineUsers" class="text-4xl font-black mt-1">
    0
</p>
            </div>
        </div>

        <div class="glass-card p-6">
            <p class="text-[10px] text-gray-500 font-black tracking-widest uppercase">Total Sales</p>
            <p class="text-6xl font-black mt-1 tracking-tighter italic">500件+</p>
            <p class="text-[10px] text-gray-500 mt-2 font-bold">総取引数</p>
        </div>

        <!-- ファンパレ -->
<div id="fanpareSection" class="space-y-6">

    <h2 class="text-2xl font-black tracking-tighter italic uppercase">
        ファンパレ アカウント
    </h2>

    <div class="item-card shadow-[0_0_20px_rgba(168,85,247,0.1)]">

        <div class="video-container">
            <iframe
                src="https://streamable.com/e/a40k0p"
                allowfullscreen
                frameborder="0">
            </iframe>
        </div>

        <div class="p-5 space-y-4">
            <div class="flex justify-between items-center font-black">
                <span class="text-[9px] text-green-400 border border-green-400/50 px-2 py-0.5 rounded bg-green-400/10 uppercase">
                    Ready
                </span>

                <span class="text-[9px] text-gray-600 uppercase">
                    Stock: 1
                </span>
            </div>

            <h3 class="text-lg font-black text-gray-200 mb-1">
                乙骨コンプ垢
            </h3>

            <p class="text-4xl font-black italic">
                1400yen
            </p>
        </div>
    </div>

<div class="item-card shadow-[0_0_20px_rgba(168,85,247,0.1)]">

        <div class="video-container">
            <iframe
                src="https://streamable.com/e/eqsh58?"
                allowfullscreen
                frameborder="0">
            </iframe>
        </div>

        <div class="p-5 space-y-4">
            <div class="flex justify-between items-center font-black">
                <span class="text-[9px] text-green-400 border border-green-400/50 px-2 py-0.5 rounded bg-green-400/10 uppercase">
                    Ready
                </span>

                <span class="text-[9px] text-gray-600 uppercase">
                    Stock: 1
                </span>
            </div>

            <h3 class="text-lg font-black text-gray-200 mb-1">
                0.2秒五条完凸垢
            </h3>

            <p class="text-4xl font-black italic">
                10000yen
            </p>
        </div>
    </div>

</div>

<!-- バウンティ -->
<div id="bountySection" class="space-y-6 hidden">

    <h2 class="text-2xl font-black tracking-tighter italic uppercase">
        バウンティ アカウント
    </h2>

    <div class="item-card shadow-[0_0_20px_rgba(59,130,246,0.15)]">

        <div class="video-container">
            <iframe
                src=""
                allowfullscreen
                frameborder="0">
            </iframe>
        </div>

        <div class="p-5 space-y-4">
            <div class="flex justify-between items-center font-black">

                <span class="text-[9px] text-cyan-400 border border-cyan-400/50 px-2 py-0.5 rounded bg-cyan-400/10 uppercase">
                    coming soon
                </span>

                <span class="text-[9px] text-gray-600 uppercase">
                    Stock: 2
                </span>
            </div>

            <h3 class="text-lg font-black text-gray-200 mb-1">
                coming soon
            </h3>

            <p class="text-4xl font-black italic">
                coming soon
            </p>
        </div>
    </div>

</div>

        <div class="space-y-3 pt-4">
            <h2 class="text-2xl font-black tracking-tighter uppercase text-gray-500 italic">Live Logs</h2>
            <div class="space-y-2">
                <div class="bg-white/5 border border-white/5 rounded-2xl p-4 flex items-center gap-3">
                    <span class="text-green-500 text-[10px] font-black uppercase tracking-tighter">[ Success ]</span>
                    <span class="text-[11px] text-gray-300 font-bold">超フェス大量垢 sold.</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>

function showSection(section){

    const fanpare = document.getElementById("fanpareSection");
    const bounty = document.getElementById("bountySection");

    const fanpareBtn = document.getElementById("fanpareBtn");
    const bountyBtn = document.getElementById("bountyBtn");

    if(section === "fanpare"){

        fanpare.classList.remove("hidden");
        bounty.classList.add("hidden");

        fanpareBtn.className =
        "flex-1 py-3 rounded-full text-xs font-black bg-purple-900/40 border border-purple-500 text-purple-200";

        bountyBtn.className =
        "flex-1 py-3 rounded-full text-xs font-black bg-white/5 border border-white/10 text-gray-500 uppercase";

    }

    else{

        bounty.classList.remove("hidden");
        fanpare.classList.add("hidden");

        bountyBtn.className =
        "flex-1 py-3 rounded-full text-xs font-black bg-cyan-900/40 border border-cyan-500 text-cyan-200 uppercase";

        fanpareBtn.className =
        "flex-1 py-3 rounded-full text-xs font-black bg-white/5 border border-white/10 text-gray-500";

    }
    
    const randomUsers = Math.floor(Math.random() * 30) + 100;

document.getElementById("onlineUsers").innerText =
randomUsers;
}

</script>
    
</body>
</html>
