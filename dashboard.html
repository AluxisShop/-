<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HNKG MARKET - DASHBOARD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&family=Noto+Sans+JP:wght@900&display=swap');
        body { 
            background: #0d0d1a; 
            color: white; 
            font-family: 'Inter', 'Noto Sans JP', sans-serif; 
            margin: 0;
        }
        .bg-grid {
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-attachment: fixed;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        .item-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(192, 132, 252, 0.15);
            border-radius: 1.2rem;
            overflow: hidden; /* 動画のはみ出し防止 */
        }
        /* 動画プレイヤーのスタイル */
        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            border-bottom: 1px solid rgba(192, 132, 252, 0.15);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-grid">
    <div class="max-w-md mx-auto px-5 pt-8 pb-12 space-y-6">
        
        <div>
            <h1 class="text-3xl font-black tracking-tighter italic uppercase">ファンパレ MARKET</h1>
            <p class="text-gray-500 text-[10px] tracking-widest font-bold">ファンパレ・バウンティ 垢販売</p>
        </div>

        <div class="flex gap-2">
            <button class="flex-1 py-3 rounded-full text-xs font-black bg-purple-900/40 border border-purple-500 text-purple-200">ファンパレ</button>
            <button class="flex-1 py-3 rounded-full text-xs font-black bg-white/5 border border-white/10 text-gray-500 uppercase">Bounty</button>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="glass-card p-4">
                <p class="text-[10px] text-gray-500 font-black tracking-widest">LIVE STOCK</p>
                <p class="text-4xl font-black mt-1">18</p>
            </div>
            <div class="glass-card p-4">
                <p class="text-[10px] text-gray-500 font-black tracking-widest">ONLINE USERS</p>
                <p class="text-4xl font-black mt-1">10</p>
            </div>
        </div>

        <div class="glass-card p-6">
            <p class="text-[10px] text-gray-500 font-black tracking-widest uppercase">Total Sales</p>
            <p class="text-6xl font-black mt-1 tracking-tighter italic">142+</p>
            <p class="text-[10px] text-gray-500 mt-2 font-bold">今月の取引数</p>
        </div>

        <div class="space-y-6">
            <h2 class="text-2xl font-black tracking-tighter italic uppercase">Account List</h2>
            
            <div class="item-card shadow-[0_0_20px_rgba(168,85,247,0.1)]">
                <div class="video-container">
                    <video controls playsinline poster="thum1.jpg">
                        <source src="your-video-1.mp4" type="video/mp4">
                        お使いのブラウザは動画タグをサポートしていません。
                    </video>
                </div>
                <div class="p-5 space-y-4">
                    <div class="flex justify-between items-center font-black">
                        <span class="text-[9px] text-green-400 border border-green-400/50 px-2 py-0.5 rounded bg-green-400/10 uppercase">Ready</span>
                        <span class="text-[9px] text-gray-600 uppercase">Stock: 1</span>
                    </div>
                    <h3 class="text-lg font-black text-gray-200 mb-1">超フェス大量・限定多数垢</h3>
                    <p class="text-4xl font-black italic">¥15,000</p>
                </div>
            </div>

            <div class="item-card shadow-[0_0_20px_rgba(168,85,247,0.1)]">
                <div class="video-container">
                    <video controls playsinline poster="thum2.jpg">
                        <source src="your-video-2.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="p-5 space-y-4">
                    <div class="flex justify-between items-center font-black">
                        <span class="text-[9px] text-green-400 border border-green-400/50 px-2 py-0.5 rounded bg-green-400/10 uppercase">Ready</span>
                        <span class="text-[9px] text-gray-600 uppercase">Stock: 2</span>
                    </div>
                    <h3 class="text-lg font-black text-gray-200 mb-1">五条完凸・初心者おすすめ垢</h3>
                    <p class="text-4xl font-black italic">¥8,000</p>
                </div>
            </div>
        </div>

        <div class="space-y-3 pt-4">
            <h2 class="text-2xl font-black tracking-tighter uppercase text-gray-500 italic">Live Logs</h2>
            <div class="space-y-2">
                <div class="bg-white/5 border border-white/5 rounded-2xl p-4 flex items-center gap-3">
                    <span class="text-green-500 text-[10px] font-black uppercase tracking-tighter">[ Success ]</span>
                    <span class="text-[11px] text-gray-300 font-bold">超フェス大量垢 sold.</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
