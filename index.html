<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pro Inventory System</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
  background:#0a0a0a;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont;
}

.card{
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
}
.btn:active{transform:scale(.97)}
</style>
</head>

<body>

<div class="p-3 border-b border-gray-800 flex justify-between">
  <div class="font-bold">⚡ PRO SYSTEM</div>
  <div>売上 ¥<span id="sales">0</span></div>
</div>

<!-- DASHBOARD -->
<div class="p-3 grid grid-cols-3 gap-2">

  <div class="card p-3">
    <div class="text-xs text-gray-400">商品数</div>
    <div class="text-xl font-bold" id="count">0</div>
  </div>

  <div class="card p-3">
    <div class="text-xs text-gray-400">売上数</div>
    <div class="text-xl font-bold" id="sold">0</div>
  </div>

  <div class="card p-3">
    <div class="text-xs text-gray-400">在庫合計</div>
    <div class="text-xl font-bold" id="stockTotal">0</div>
  </div>

</div>

<!-- ADD (ADMIN ONLY) -->
<div id="adminPanel" class="p-3 grid grid-cols-2 gap-2 hidden">

  <input id="name" class="card p-2" placeholder="商品名">
  <input id="price" class="card p-2" placeholder="価格">
  <input id="stock" class="card p-2" placeholder="在庫">
  <input id="img" class="card p-2 col-span-2" placeholder="画像URL">

  <button onclick="add()"
    class="bg-blue-600 p-3 rounded col-span-2">
    ＋追加
  </button>

</div>

<!-- LIST -->
<div id="list" class="p-3 grid gap-3"></div>

<script>

// 🔐 管理キー（これ知ってる人だけ編集OK）
const ADMIN_KEY = "hanakage_admin";

const params = new URLSearchParams(location.search);
const isAdmin = params.get("admin") === ADMIN_KEY;

// データ
let data = JSON.parse(localStorage.getItem("shop")||"[]");
let sales = Number(localStorage.getItem("sales")||0);

function save(){
  localStorage.setItem("shop",JSON.stringify(data));
  localStorage.setItem("sales",sales);
}

// 管理UI表示
if(isAdmin){
  document.getElementById("adminPanel").classList.remove("hidden");
}

// ADD
function add(){

  const n = name.value;
  const p = Number(price.value||0);
  const s = Number(stock.value||0);

  if(!n) return alert("商品名必須");

  data.unshift({
    id:Date.now(),
    name:n,
    price:p,
    stock:s,
    sold:0,
    img:img.value
  });

  name.value=price.value=stock.value=img.value="";
  save();
  render();
}

// BUY
function buy(id){

  data = data.map(i=>{
    if(i.id===id && i.stock>0){
      i.stock--;
      i.sold++;
      sales += i.price;

      window.open("https://buy.stripe.com/test_xxx","_blank");
    }
    return i;
  });

  save();
  render();
}

// DELETE
function del(id){
  if(!isAdmin) return alert("権限なし");
  data = data.filter(i=>i.id!==id);
  save();
  render();
}

// STATS
function calc(){

  document.getElementById("count").textContent = data.length;

  document.getElementById("sold").textContent =
    data.reduce((a,b)=>a+(b.sold||0),0);

  document.getElementById("stockTotal").textContent =
    data.reduce((a,b)=>a+(b.stock||0),0);

  document.getElementById("sales").textContent = sales;
}

// RENDER
function render(){

  calc();

  const list = document.getElementById("list");

  list.innerHTML="";

  data
  .sort((a,b)=>(b.sold||0)-(a.sold||0))
  .forEach(i=>{

    list.innerHTML += `
      <div class="card p-3">

        ${i.img ? `
          <img src="${i.img}" class="h-40 w-full object-cover rounded mb-2">
        ` : ""}

        <div class="font-bold">${i.name}</div>

        <div class="text-gray-400">
          ¥${i.price} / 在庫:${i.stock}
        </div>

        <div class="text-xs text-yellow-400 mt-1">
          🔥 ${i.sold||0} sold
        </div>

        <button onclick="buy(${i.id})"
          class="w-full mt-2 bg-blue-600 p-2 rounded">
          購入
        </button>

        ${isAdmin ? `
          <button onclick="del(${i.id})"
            class="w-full mt-2 text-red-400 text-xs">
            削除
          </button>
        ` : ""}

      </div>
    `;
  });
}

render();

</script>

</body>
</html>
