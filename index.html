<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HNKG MARKET</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#070707;
overflow-x:hidden;
color:white;
min-height:100vh;
}

/* 背景 */

.bg{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
background:
radial-gradient(circle at 20% 20%,rgba(0,255,255,.12),transparent 30%),
radial-gradient(circle at 80% 40%,rgba(255,0,255,.12),transparent 30%),
radial-gradient(circle at 50% 80%,rgba(0,140,255,.12),transparent 30%);
animation:moveBg 10s infinite alternate;
z-index:-2;
}

@keyframes moveBg{
from{
transform:scale(1);
}
to{
transform:scale(1.2);
}
}

/* パーティクル */

.particle{
position:fixed;
width:3px;
height:3px;
background:white;
border-radius:50%;
opacity:.4;
animation:float 10s linear infinite;
}

@keyframes float{
from{
transform:translateY(100vh);
}
to{
transform:translateY(-100px);
}
}

/* Header */

header{
padding:40px 20px;
text-align:center;
}

.logo{
font-size:3rem;
font-weight:700;
letter-spacing:3px;
}

.logo span{
color:#00e1ff;
}

.sub{
opacity:.6;
margin-top:10px;
}

/* Stats */

.stats{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
padding:20px;
}

.stat{
width:150px;

background:rgba(255,255,255,.05);
backdrop-filter:blur(15px);

border:1px solid rgba(255,255,255,.08);

padding:18px;
border-radius:18px;
text-align:center;
}

.stat h2{
color:#00e1ff;
}

/* Game Select */

.section-title{
text-align:center;
font-size:1.7rem;
margin-top:30px;
margin-bottom:20px;
}

.games{
max-width:1200px;
margin:auto;
padding:20px;

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.game-card{

background:rgba(255,255,255,.05);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.08);

border-radius:25px;

padding:30px;

transition:.3s;

cursor:pointer;

position:relative;

overflow:hidden;
}

.game-card:hover{
transform:translateY(-10px);
border-color:#00e1ff;
box-shadow:0 0 35px rgba(0,225,255,.2);
}

.game-icon{
font-size:3rem;
margin-bottom:15px;
}

.game-name{
font-size:1.4rem;
font-weight:600;
}

.game-desc{
opacity:.6;
margin-top:10px;
font-size:.9rem;
}

/* Ranking */

.ranking{
max-width:1200px;
margin:50px auto;
padding:20px;
}

.rank-box{

background:rgba(255,255,255,.05);

backdrop-filter:blur(20px);

border-radius:25px;

padding:25px;
}

.rank-item{
display:flex;
justify-content:space-between;
padding:15px 0;
border-bottom:1px solid rgba(255,255,255,.05);
}

/* Footer */

footer{
padding:40px;
text-align:center;
opacity:.5;
}

</style>
</head>

<body>

<div class="bg"></div>

<header>

<div class="logo">
HNKG <span>MARKET</span>
</div>

<div class="sub">
Premium Account Marketplace
</div>

</header>

<div class="stats">

<div class="stat">
<h2>128</h2>
<p>総在庫</p>
</div>

<div class="stat">
<h2>4892</h2>
<p>販売実績</p>
</div>

<div class="stat">
<h2>3分</h2>
<p>平均対応</p>
</div>

</div>

<h2 class="section-title">
🎮 ゲームを選択
</h2>

<div class="games">

<div class="game-card">
<div class="game-icon">⚔️</div>
<div class="game-name">ファンパレ</div>
<div class="game-desc">
限定キャラ・完凸多数
</div>
</div>

<div class="game-card">
<div class="game-icon">🏴‍☠️</div>
<div class="game-name">バウンティラッシュ</div>
<div class="game-desc">
超フェス・高スコア
</div>
</div>

<div class="game-card">
<div class="game-icon">🧸</div>
<div class="game-name">ツムツム</div>
<div class="game-desc">
コイン大量・高レベル
</div>
</div>

<div class="game-card">
<div class="game-icon">🎲</div>
<div class="game-name">その他</div>
<div class="game-desc">
人気ゲーム多数
</div>
</div>

</div>

<div class="ranking">

<div class="rank-box">

<h2 style="margin-bottom:20px;">
🏆 人気ランキング
</h2>

<div class="rank-item">
<span>SSS ファンパレ</span>
<span>1位</span>
</div>

<div class="rank-item">
<span>SS バウンティ</span>
<span>2位</span>
</div>

<div class="rank-item">
<span>SSS ツムツム</span>
<span>3位</span>
</div>

</div>

</div>

<footer>
© HNKG MARKET
</footer>

<script>

for(let i=0;i<40;i++){

let p=document.createElement("div");

p.className="particle";

p.style.left=Math.random()*100+"%";

p.style.animationDuration=
(Math.random()*10+5)+"s";

p.style.opacity=Math.random();

document.body.appendChild(p);

}

</script>

</body>
</html>
