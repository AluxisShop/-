<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mobile Shop Pro</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#050505;color:white}
.card{
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;
}
.btn:active{transform:scale(.97)}
</style>
</head>

<body>

<!-- ヘッダー -->
<div class="p-3 flex justify-between border-b border-gray-800">
  <div class="font-bold">⚡ Shop Pro</div>
  <div>売上 ¥<span id="sales">0</span></div>
</div>

<!-- 検索 -->
<div class="p-3">
  <input id="search" oninput="render()"
    class="w-full p-2 rounded bg-gray-900"
    placeholder="商品検索">
</div>

<!-- 入力 -->
<div class="p-3 grid grid-cols-2 gap-2">
  <input id="name" class="card p-2" placeholder="商品名">
  <input id="price" class="card p-2" placeholder="価格">
  <input id="img" class="card p-2 col-span-2" placeholder="画像URL">

  <button onclick="add()"
    class="bg-blue-600 p-2 rounded col-span-2 btn">
    追加
  </button>
</div>

<!-- 商品一覧 -->
<div id="list" class="p-3 grid gap-3"></div>

<div id="empty" class="hidden text-center text-gray-500 p-10">
  商品なし
</div>

<script>
let data = JSON.parse(localStorage.getItem("shop")||"[]");
let sales = Number(localStorage.getItem("sales")||0);

function save(){
  localStorage.setItem("shop",JSON.stringify(data));
  localStorage.setItem("sales",sales);
}

function add(){
  if(!name.value) return alert("商品名必須");

  data.unshift({
    id:Date.now(),
    name:name.value,
    price:Number(price.value||0),
    img:img.value,
    sold:0
  });

  name.value=price.value=img.value="";
  save();
  render();
}

function buy(id){
  data = data.map(i=>{
    if(i.id===id){
      i.sold = (i.sold||0) + 1;
      sales += i.price;

      window.open("https://buy.stripe.com/test_xxx","_blank");
    }
    return i;
  });
  save();
  render();
}

function del(id){
  data = data.filter(i=>i.id!==id);
  save();
  render();
}

function getParam(){
  return new URLSearchParams(location.search).get("item");
}

function render(){

  const q = search.value.toLowerCase();

  let filtered = data.filter(i =>
    i.name.toLowerCase().includes(q)
  );

  // ⭐ランキング（売れた順）
  filtered.sort((a,b)=> (b.sold||0)-(a.sold||0));

  const id = getParam();

  // ⭐商品単体ページ
  if(id){
    const item = data.find(i=>i.id==id);
    if(!item) return;

    list.innerHTML = `
      <div class="card p-4">

        ${item.img ? `
          <img src="${item.img}" class="w-full h-52 object-cover rounded">
        ` : ""}

        <div class="text-xl font-bold mt-2">${item.name}</div>
        <div class="text-gray-400">¥${item.price}</div>
        <div class="text-yellow-400 text-sm">🔥売れ数 ${item.sold||0}</div>

        <button onclick="buy(${item.id})"
          class="w-full mt-3 bg-blue-600 p-3 rounded btn">
          今すぐ購入
        </button>

        <button onclick="location.href='/'"
          class="w-full mt-2 text-sm text-gray-400">
          戻る
        </button>

      </div>
    `;
    return;
  }

  list.innerHTML="";
  salesEl.textContent=sales;

  empty.style.display = filtered.length ? "none" : "block";

  filtered.forEach(i=>{
    list.innerHTML += `
      <div class="card p-3">

        ${i.img ? `
          <img src="${i.img}" class="h-40 w-full object-cover rounded mb-2">
        ` : ""}

        <div class="font-bold">${i.name}</div>
        <div class="text-sm text-gray-400">¥${i.price}</div>
        <div class="text-xs text-yellow-400">🔥売れ ${i.sold||0}</div>

        <div class="flex gap-2 mt-2">

          <button onclick="buy(${i.id})"
            class="flex-1 bg-blue-600 p-2 rounded btn">
            購入
          </button>

          <a href="?item=${i.id}"
            class="bg-gray-700 p-2 rounded text-xs">
            商品
          </a>

          <button onclick="del(${i.id})"
            class="bg-red-500 p-2 px-3 rounded">
            ×
          </button>

        </div>
      </div>
    `;
  });
}

const salesEl=document.getElementById("sales");

render();
</script>

</body>
</html>
