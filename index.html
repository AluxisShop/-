<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pro Inventory Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
.glass {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.08);
}
</style>
</head>

<body class="bg-black text-white min-h-screen">

<!-- ヘッダー -->
<div class="p-6 flex justify-between items-center border-b border-gray-800">
  <h1 class="text-2xl font-bold">⚡ Inventory Pro</h1>

  <div class="flex gap-2">
    <input id="search" oninput="render()" placeholder="検索..."
      class="px-3 py-1 bg-gray-900 rounded text-sm">

    <select id="filter" onchange="render()" class="bg-gray-900 px-2 rounded text-sm">
      <option value="all">すべて</option>
      <option value="stock">在庫</option>
      <option value="sold">売却済み</option>
    </select>

    <button onclick="clearAll()" class="bg-red-600 px-3 py-1 rounded text-sm">
      全削除
    </button>
  </div>
</div>

<!-- 入力 -->
<div class="p-6 grid md:grid-cols-5 gap-3">
  <input id="name" class="bg-gray-900 p-2 rounded" placeholder="商品名">
  <input id="price" class="bg-gray-900 p-2 rounded" placeholder="価格">
  <input id="img" class="bg-gray-900 p-2 rounded" placeholder="画像URL">
  <input id="note" class="bg-gray-900 p-2 rounded" placeholder="メモ">
  <button onclick="addItem()" class="bg-blue-600 rounded">追加</button>
</div>

<!-- 一覧 -->
<div id="list" class="p-6 grid md:grid-cols-3 gap-4"></div>

<script>
let data = JSON.parse(localStorage.getItem("inv_pro") || "[]");

function save(){
  localStorage.setItem("inv_pro", JSON.stringify(data));
  render();
}

function addItem(){
  const name = nameEl().value;
  if(!name) return alert("商品名必須");

  data.push({
    id: Date.now(),
    name,
    price: priceEl().value,
    img: imgEl().value,
    note: noteEl().value,
    sold: false
  });

  nameEl().value = "";
  priceEl().value = "";
  imgEl().value = "";
  noteEl().value = "";

  save();
}

function toggleSold(id){
  data = data.map(i => i.id === id ? {...i, sold: !i.sold} : i);
  save();
}

function deleteItem(id){
  data = data.filter(i => i.id !== id);
  save();
}

function clearAll(){
  if(confirm("本当に全部削除？")) {
    data = [];
    save();
  }
}

function render(){
  const list = document.getElementById("list");
  const q = document.getElementById("search").value || "";
  const filter = document.getElementById("filter").value;

  list.innerHTML = "";

  data
    .filter(i => i.name.includes(q))
    .filter(i => {
      if(filter === "stock") return !i.sold;
      if(filter === "sold") return i.sold;
      return true;
    })
    .forEach(item => {

      list.innerHTML += `
        <div class="glass rounded-xl p-4 hover:scale-[1.02] transition">

          <div class="h-40 bg-gray-800 rounded mb-3 overflow-hidden">
            ${item.img ? `<img src="${item.img}" class="w-full h-full object-cover">` : ""}
          </div>

          <div class="text-lg font-bold">${item.name}</div>
          <div class="text-sm text-gray-400">💰 ${item.price || "未設定"}</div>
          <div class="text-sm text-gray-500 mt-1">${item.note || ""}</div>

          <div class="mt-3 flex gap-2 flex-wrap">

            <button onclick="toggleSold(${item.id})"
              class="${item.sold ? "bg-green-600" : "bg-blue-600"} px-3 py-1 rounded text-sm">
              ${item.sold ? "売却済み" : "購入する"}
            </button>

            <button onclick="deleteItem(${item.id})"
              class="bg-red-500 px-3 py-1 rounded text-sm">
              削除
            </button>

          </div>
        </div>
      `;
    });
}

function nameEl(){ return document.getElementById("name"); }
function priceEl(){ return document.getElementById("price"); }
function imgEl(){ return document.getElementById("img"); }
function noteEl(){ return document.getElementById("note"); }

render();
</script>

</body>
</html>
