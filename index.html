<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HNKG MARKET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:#050505;color:#fff}
body:before{
content:"";position:fixed;inset:0;
background:
radial-gradient(circle at top left,rgba(0,180,255,.05),transparent 35%),
radial-gradient(circle at bottom right,rgba(255,0,140,.04),transparent 35%);
pointer-events:none;z-index:-1}
.container{max-width:1200px;margin:auto;padding:20px}
header{text-align:center;padding:50px 0 30px}
.logo{font-size:2.6rem;font-weight:800;letter-spacing:2px}
.market{color:#00d8ff}
.sub{opacity:.5;letter-spacing:3px;font-size:.75rem;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:30px 0}
.stat,.game,.card{background:#0d0d0d;border:1px solid #1f1f1f;border-radius:24px}
.stat{padding:20px;text-align:center}
.stat h2{font-size:2rem}
h2.title{text-align:center;margin:40px 0 20px}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.game{padding:22px;font-size:1.1rem;cursor:pointer;transition:.25s}
.game:hover{transform:translateY(-3px);border-color:#333}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:25px 0}
input,select{background:#111;color:#fff;border:1px solid #222;padding:14px;border-radius:14px;min-width:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{overflow:hidden}
.img{height:190px;background:#151515;display:flex;align-items:center;justify-content:center;color:#666}
.content{padding:18px}
.pick{color:#f5c542;font-weight:700}
.badge{display:inline-block;background:#fff;color:#000;padding:5px 10px;border-radius:999px;margin:8px 0;font-weight:700}
.price{font-size:1.7rem;font-weight:800;margin:10px 0}
.stock{color:#ff8d8d}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:#fff;color:#000;font-weight:700}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);align-items:center;justify-content:center;padding:20px}
.modalbox{background:#0d0d0d;border:1px solid #222;border-radius:24px;padding:25px;max-width:500px;width:100%}
.buy{display:block;text-align:center;background:#fff;color:#000;padding:14px;border-radius:12px;text-decoration:none;margin-top:15px;font-weight:700}
footer{text-align:center;opacity:.4;padding:40px}
@media(max-width:700px){
.stats{grid-template-columns:1fr}
.games{grid-template-columns:1fr 1fr}
.logo{font-size:2rem}
}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo">HNKG <span class="market">MARKET</span></div>
<div class="sub">PREMIUM ACCOUNT MARKETPLACE</div>
</header>

<div class="stats">
<div class="stat"><h2>128</h2><p>総在庫</p></div>
<div class="stat"><h2>4892</h2><p>販売実績</p></div>
<div class="stat"><h2>3分</h2><p>平均対応</p></div>
</div>

<h2 class="title">🎮 ゲームを選択</h2>
<div class="games">
<div class="game">⚔️ ファンパレ</div>
<div class="game">🏴‍☠️ バウンティ</div>
<div class="game">🧸 ツムツム</div>
<div class="game">🎲 すべて表示</div>
</div>

<h2 class="title">📦 在庫一覧</h2>

<div class="tools">
<input placeholder="商品検索">
<select><option>全ランク</option><option>S</option><option>SS</option><option>SSS</option></select>
</div>

<div class="grid">
<div class="card">
<div class="img">商品画像を配置</div>
<div class="content">
<div class="pick">🏆 PICK UP</div>
<div class="badge">SSS</div>
<h3>五条完凸アカウント</h3>
<p>ファンパレ</p>
<div class="stock">🔥 残り1件</div>
<div class="price">¥7,980</div>
<button class="btn">詳細を見る</button>
</div>
</div>

<div class="card">
<div class="img">商品画像を配置</div>
<div class="content">
<div class="badge">SS</div>
<h3>ニカルフィ所持</h3>
<p>バウンティ</p>
<div class="stock">🔥 残り2件</div>
<div class="price">¥4,980</div>
<button class="btn">詳細を見る</button>
</div>
</div>
</div>

<footer>© HNKG MARKET</footer>
</div>
</body>
</html>
