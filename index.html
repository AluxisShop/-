<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SHOP SYSTEM PRO</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
  background:#0b0b0f;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont;
}

.sidebar{
  width:240px;
  background:rgba(255,255,255,0.04);
  border-right:1px solid rgba(255,255,255,0.08);
}

.card{
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
}

.btn:active{transform:scale(.97)}
</style>
</head>

<body class="flex">

<!-- SIDEBAR -->
<div class="sidebar p-4 hidden md:block">

  <div class="text-xl font-bold mb-6">🛍 SHOP PRO</div>

  <div class="space-y-2 text-sm text-gray-300">
    <div>📊 Dashboard</div>
    <div>📦 Products</div>
    <div>💰 Sales</div>
    <div>📤 Export CSV</div>
  </div>

  <button onclick="exportCSV()"
    class="mt-6 w-full bg-blue-600 p-2 rounded text-sm">
    CSV出力
  </button>

</div>

<!-- MAIN -->
<div class="flex-1 p-4">

<!-- STATS -->
<div class="grid grid-cols-3 gap-2 mb-4">

  <div class="card p-3">
    <div class="text-xs text-gray-400">売上</div>
    <div class="text-xl font-bold">¥<span id="sales">0</span></div>
  </div>

  <div class="card p-3">
    <div class="text-xs text-gray-400">商品数</div>
    <div class="text-xl font-bold" id="count">0</div>
  </div>

  <div class="card p-3">
    <div class="text-xs text-gray-400">在庫</div>
    <div class="text-xl font-bold" id="stockTotal">0</div>
  </div>

</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="card p-3 mb-4 grid grid-cols-2 gap-2 hidden">

  <input id="name" class="p-2 bg-black/40 rounded" placeholder="商品名">
  <input id="price" class="p-2 bg-black/40 rounded" placeholder="価格">
  <input id="stock" class="p-2 bg-black/40 rounded" placeholder="在庫">
  <input id="img" class="p-2 bg-black/40 rounded col-span-2" placeholder="画像URL">

  <button onclick="add()"
    class="bg-blue-600 p-3 rounded col-span-2">
    ＋商品追加
  </button>

</div>

<!-- PRODUCT LIST -->
<div id="list" class="grid md:grid-cols-3 gap-3"></div>

</div>

<script>

const ADMIN_KEY = "shop_admin";
const isAdmin = new URLSearchParams(location.search).get("admin") === ADMIN_KEY;

// DATA
let data = JSON.parse(localStorage.getItem("shop")||"[]");
let sales = Number(localStorage.getItem("sales")||0);

if(isAdmin){
  document.getElementById("adminPanel").classList.remove("hidden");
}

function save(){
  localStorage.setItem("shop",JSON.stringify(data));
  localStorage.setItem("sales",sales);
}

// ADD
function add(){

  if(!name.value) return alert("商品名必須");

  data.unshift({
    id:Date.now(),
    name:name.value,
    price:Number(price.value||0),
    stock:Number(stock.value||0),
    img:img.value,
    sold:0
  });

  name.value=price.value=stock.value=img.value="";
  save();
  render();
}

// 💳 STRIPE（ここ差し替え）
function buy(item){

  // 👉 本番ではここをStripe APIに変更
  window.open("https://buy.stripe.com/test_xxx","_blank");

  data = data.map(i=>{
    if(i.id===item.id && i.stock>0){
      i.stock--;
      i.sold++;
      sales += i.price;
    }
    return i;
  });

  save();
  render();
}

// DELETE
function del(id){
  if(!isAdmin) return;
  data = data.filter(i=>i.id!==id);
  save();
  render();
}

// CSV EXPORT
function exportCSV(){

  let csv = "name,price,stock,sold\n";

  data.forEach(i=>{
    csv += `${i.name},${i.price},${i.stock},${i.sold}\n`;
  });

  const blob = new Blob([csv],{type:"text/csv"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "sales.csv";
  a.click();
}

// STATS
function calc(){

  document.getElementById("sales").textContent = sales;

  document.getElementById("count").textContent = data.length;

  document.getElementById("stockTotal").textContent =
    data.reduce((a,b)=>a+(b.stock||0),0);
}

// LP（商品ページ）
function render(){

  calc();

  const list = document.getElementById("list");
  const id = new URLSearchParams(location.search).get("item");

  // =====================
  // LP MODE
  // =====================
  if(id){
    const item = data.find(i=>i.id==id);
    if(!item) return;

    list.innerHTML = `
      <div class="card p-4">

        <img src="${item.img}"
          class="w-full h-64 object-cover rounded mb-3">

        <div class="text-2xl font-bold">${item.name}</div>

        <div class="text-gray-300">¥${item.price}</div>

        <div class="text-yellow-400 text-sm mt-2">
          🔥 ${item.sold||0} sold
        </div>

        <div class="text-gray-400 text-sm mt-2">
          在庫：${item.stock}
        </div>

        <button onclick="buy(${item.id})"
          class="w-full mt-4 bg-blue-600 p-3 rounded text-lg">
          今すぐ購入
        </button>

        <button onclick="location.href='/'"
          class="w-full mt-2 text-gray-400 text-sm">
          ← 戻る
        </button>

      </div>
    `;
    return;
  }

  // =====================
  // GRID MODE
  // =====================
  list.innerHTML="";

  data
  .sort((a,b)=>(b.sold||0)-(a.sold||0))
  .forEach(i=>{

    const warn = i.stock <= 3 ? "text-red-400" : "text-gray-400";

    list.innerHTML += `
      <div class="card p-3">

        <img src="${i.img}"
          class="h-40 w-full object-cover rounded mb-2"
          onclick="location.href='?item=${i.id}'">

        <div class="font-bold">${i.name}</div>

        <div class="${warn}">
          ¥${i.price} / 在庫:${i.stock}
        </div>

        <div class="text-xs text-yellow-400 mt-1">
          🔥 ${i.sold||0}
        </div>

        <button onclick="buy(${i.id})"
          class="w-full mt-2 bg-blue-600 p-2 rounded">
          購入
        </button>

        ${isAdmin ? `
          <button onclick="del(${i.id})"
            class="w-full mt-2 text-red-400 text-xs">
            削除
          </button>
        ` : ""}

      </div>
    `;
  });
}

render();

</script>

</body>
</html>
