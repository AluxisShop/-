<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shop Pro Secure FIX</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
  background:#050505;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

.card{
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
}

.btn:active{transform:scale(.97)}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="fixed inset-0 flex items-center justify-center bg-black z-50">
  <div class="card p-6 w-80">
    <h1 class="font-bold mb-3">ADMIN LOGIN</h1>
    <input id="pass" type="password"
      class="w-full p-2 bg-black/50 rounded"
      placeholder="password">

    <button onclick="login()"
      class="w-full mt-3 bg-blue-600 p-2 rounded">
      ログイン
    </button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<!-- HEADER -->
<div class="p-3 flex justify-between border-b border-gray-800">
  <div class="font-bold">⚡ Shop Pro</div>
  <div>売上 ¥<span id="sales">0</span></div>
</div>

<!-- SEARCH -->
<div class="p-3">
  <input id="search"
    oninput="render()"
    class="w-full p-2 rounded bg-gray-900"
    placeholder="検索">
</div>

<!-- ADD -->
<div class="p-3 grid grid-cols-2 gap-2">

  <input id="name" class="card p-2" placeholder="商品名">
  <input id="price" class="card p-2" placeholder="価格">

  <input id="img" class="card p-2 col-span-2" placeholder="画像URL">
  <input id="video" class="card p-2 col-span-2" placeholder="動画URL（YouTube）">

  <textarea id="desc"
    class="card p-2 col-span-2"
    placeholder="商品説明"></textarea>

  <button onclick="add()"
    class="bg-blue-600 p-3 rounded col-span-2 btn">
    ＋追加
  </button>

</div>

<!-- LIST -->
<div id="list" class="p-3 grid gap-4"></div>

<div id="empty" class="hidden text-center text-gray-500 p-10">
  商品なし
</div>

</div>

<script>

const ADMIN_PASS = "admin123";
let isAdmin = false;

function login(){
  const passInput = document.getElementById("pass");
  const loginBox = document.getElementById("login");
  const appBox = document.getElementById("app");

  if(passInput.value === ADMIN_PASS){
    loginBox.style.display = "none";
    appBox.classList.remove("hidden");
    isAdmin = true;
    render();
  } else {
    alert("パスワード違う");
  }
}

// DATA
let data = JSON.parse(localStorage.getItem("shop") || "[]");
let sales = Number(localStorage.getItem("sales") || 0);

function save(){
  localStorage.setItem("shop", JSON.stringify(data));
  localStorage.setItem("sales", sales);
}

// ADD
function add(){

  const nameEl = document.getElementById("name");
  const priceEl = document.getElementById("price");
  const imgEl = document.getElementById("img");
  const videoEl = document.getElementById("video");
  const descEl = document.getElementById("desc");

  if(!nameEl.value) return alert("商品名必須");

  data.unshift({
    id: Date.now(),
    name: nameEl.value,
    price: Number(priceEl.value || 0),
    img: imgEl.value,
    video: videoEl.value,
    desc: descEl.value,
    sold: 0
  });

  nameEl.value = priceEl.value = imgEl.value = videoEl.value = descEl.value = "";

  save();
  render();
}

// BUY
function buy(id){
  data = data.map(i=>{
    if(i.id === id){
      i.sold = (i.sold || 0) + 1;
      sales += i.price;
      window.open("https://buy.stripe.com/test_xxx", "_blank");
    }
    return i;
  });

  save();
  render();
}

// DELETE
function del(id){
  if(!isAdmin) return alert("管理者のみ");
  data = data.filter(i => i.id !== id);
  save();
  render();
}

// PARAM
function getParam(){
  return new URLSearchParams(location.search).get("item");
}

// YOUTUBE
function convertYouTube(url){
  if(!url) return "";
  if(url.includes("watch?v=")){
    return url.replace("watch?v=", "embed/");
  }
  return url;
}

// RENDER
function render(){

  const searchEl = document.getElementById("search") || {value:""};
  const q = searchEl.value.toLowerCase();

  let filtered = data.filter(i =>
    i.name.toLowerCase().includes(q)
  );

  filtered.sort((a,b)=>(b.sold||0)-(a.sold||0));

  const id = getParam();

  const list = document.getElementById("list");
  const salesEl = document.getElementById("sales");
  const empty = document.getElementById("empty");

  // DETAIL PAGE
  if(id){
    const item = data.find(i => i.id == id);
    if(!item) return;

    list.innerHTML = `
      <div class="card p-5">

        ${item.img ? `
          <img src="${item.img}" class="w-full h-60 object-cover rounded mb-3">
        ` : ""}

        <div class="text-2xl font-bold">${item.name}</div>
        <div class="text-gray-300">¥${item.price}</div>

        <div class="text-yellow-400 text-sm mt-2">
          🔥 ${item.sold || 0}件販売
        </div>

        ${item.video ? `
          <iframe width="100%" height="200"
          src="${convertYouTube(item.video)}"
          frameborder="0"
          allowfullscreen></iframe>
        ` : ""}

        <div class="mt-3 text-sm text-gray-300">
          ${item.desc || ""}
        </div>

        <button onclick="buy(${item.id})"
          class="w-full mt-5 bg-blue-600 p-4 rounded text-xl">
          今すぐ購入
        </button>

        <button onclick="location.href='/'"
          class="w-full mt-2 text-gray-400 text-sm">
          ← 戻る
        </button>

      </div>
    `;
    return;
  }

  // LIST
  list.innerHTML = "";
  salesEl.textContent = sales;

  empty.style.display = filtered.length ? "none" : "block";

  filtered.forEach(i=>{
    list.innerHTML += `
      <div class="card p-4">

        ${i.img ? `
          <img src="${i.img}" class="h-48 w-full object-cover rounded mb-3">
        ` : ""}

        <div class="font-bold">${i.name}</div>
        <div class="text-gray-400">¥${i.price}</div>

        <button onclick="buy(${i.id})"
          class="w-full mt-3 bg-blue-600 p-3 rounded">
          購入
        </button>

        <div class="flex justify-between mt-2 text-xs">
          <a href="?item=${i.id}" class="text-gray-400">詳細</a>

          ${isAdmin ? `
            <button onclick="del(${i.id})"
              class="text-red-400">削除</button>
          ` : ""}
        </div>

      </div>
    `;
  });
}

// INIT
render();

</script>

</body>
</html>
