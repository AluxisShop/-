<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inventory System</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#050505;color:white}
.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08)}
.btn{transition:.15s}
.btn:active{transform:scale(.96)}
</style>
</head>

<body>

<!-- ログイン -->
<div id="login" class="fixed inset-0 flex items-center justify-center bg-black z-50">
  <div class="glass p-6 rounded-xl w-80">
    <h1 class="font-bold mb-3">LOGIN</h1>
    <input id="pass" type="password" class="w-full p-2 bg-black/50 rounded" placeholder="password">
    <button onclick="loginCheck()" class="mt-3 w-full bg-blue-600 p-2 rounded btn">ログイン</button>
  </div>
</div>

<!-- 本体 -->
<div id="app" class="hidden">

<!-- ヘッダー -->
<header class="p-3 flex justify-between items-center border-b border-gray-800">
  <div class="font-bold">⚡ Inventory Pro</div>
  <div class="text-sm">売上: ¥<span id="sales">0</span></div>
</header>

<!-- 入力 -->
<div class="p-3 grid grid-cols-2 md:grid-cols-5 gap-2">
  <input id="name" class="glass p-2 text-sm" placeholder="商品名">
  <input id="price" class="glass p-2 text-sm" placeholder="価格">
  <input id="img" class="glass p-2 text-sm" placeholder="画像URL">
  <input id="stock" class="glass p-2 text-sm" placeholder="在庫数">
  <button onclick="add()" class="bg-blue-600 rounded btn">追加</button>
</div>

<!-- 一覧 -->
<div id="list" class="p-3 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>

</div>

<script>
const PASS = "hanakage1313";

function loginCheck(){
  if(pass.value === PASS){
    login.style.display="none";
    app.classList.remove("hidden");
    render();
  } else alert("パスワード違う");
}

// DB
let data = JSON.parse(localStorage.getItem("db")||"[]");
let sales = Number(localStorage.getItem("sales")||0);

function save(){
  localStorage.setItem("db",JSON.stringify(data));
  localStorage.setItem("sales",sales);
  render();
}

function add(){
  if(!name.value) return alert("商品名必須");

  data.unshift({
    id:Date.now(),
    name:name.value,
    price:Number(price.value||0),
    img:img.value,
    stock:Number(stock.value||0),
    sold:0
  });

  name.value="";
  price.value="";
  img.value="";
  stock.value="";

  save();
}

function sell(id){
  data = data.map(i=>{
    if(i.id===id && i.stock>0){
      i.stock--;
      i.sold++;
      sales += i.price;
    }
    return i;
  });
  save();
}

function del(id){
  data = data.filter(i=>i.id!==id);
  save();
}

function render(){
  list.innerHTML="";
  salesEl.textContent=sales;

  data.forEach(i=>{
    list.innerHTML += `
      <div class="glass rounded-xl overflow-hidden">

        ${i.img ? `<img src="${i.img}" class="h-40 w-full object-cover">` : ""}

        <div class="p-3">
          <div class="font-bold">${i.name}</div>
          <div class="text-sm text-gray-400">¥${i.price}</div>
          <div class="text-xs text-gray-500">在庫:${i.stock} / 売:${i.sold}</div>

          <div class="flex gap-2 mt-3">

            <button onclick="sell(${i.id})"
              class="flex-1 bg-blue-600 p-2 rounded btn">
              購入
            </button>

            

            <button onclick="del(${i.id})" class="bg-red-500 p-2 rounded text-xs">×</button>
          </div>
        </div>
      </div>
    `;
  });
}

// UI
const salesEl=document.getElementById("sales");

render();
</script>

</body>
</html>
