<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HNKG MARKET Ultimate</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0b0f19;color:#fff;font-family:-apple-system,sans-serif;padding-bottom:90px}
.card{background:rgba(255,255,255,.08);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.08);border-radius:20px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111827;border-top:1px solid #333;padding:10px;display:flex;justify-content:space-around}
</style>
</head>
<body class="p-4">
<h1 class="text-4xl font-black">HNKG MARKET</h1>
<p class="text-gray-400 mb-4">スマホ特化ショップ</p>

<div class="grid grid-cols-2 gap-3 mb-4">
<div class="card p-4"><div>売上</div><div class="text-2xl font-bold">¥<span id="sales">0</span></div></div>
<div class="card p-4"><div>商品数</div><div class="text-2xl font-bold"><span id="count">0</span></div></div>
</div>

<div class="card p-4 mb-4">
<h2 class="font-bold text-xl mb-2">人気ランキング TOP5</h2>
<div id="ranking"></div>
</div>

<div class="card p-4 mb-4">
<h2 class="font-bold mb-2">売上グラフ</h2>
<canvas id="chart" height="120"></canvas>
</div>

<div class="card p-4 mb-4">
<input id="name" class="text-black p-3 rounded w-full mb-2" placeholder="商品名">
<input id="price" class="text-black p-3 rounded w-full mb-2" placeholder="価格">
<input id="img" class="text-black p-3 rounded w-full mb-2" placeholder="画像URL">
<textarea id="desc" class="text-black p-3 rounded w-full mb-2" placeholder="説明"></textarea>
<button onclick="addProduct()" class="bg-green-600 w-full p-3 rounded">商品追加</button>
</div>

<input id="search" oninput="render()" class="text-black p-3 rounded w-full mb-4" placeholder="検索">

<div id="list" class="space-y-4"></div>

<div id="detail" class="hidden fixed inset-0 bg-black overflow-auto p-4 z-50"></div>

<div class="nav">
<button onclick="window.scrollTo(0,0)">🏠</button>
<button onclick="document.getElementById('ranking').scrollIntoView()">🔥</button>
<button onclick="document.getElementById('list').scrollIntoView()">📦</button>
</div>

<script>
let sales=Number(localStorage.getItem("sales")||0);
let products=JSON.parse(localStorage.getItem("ultimate_products")||"[]");

function save(){
 localStorage.setItem("ultimate_products",JSON.stringify(products));
 localStorage.setItem("sales",sales);
 render();
}

function addProduct(){
 products.unshift({
  id:Date.now(),
  name:name.value,
  price:Number(price.value||0),
  img:img.value,
  desc:desc.value,
  sold:0
 });
 save();
}

function buy(id){
 let p=products.find(x=>x.id===id);
 if(!p)return;
 p.sold++;
 sales+=p.price;
 save();
}

function showDetail(id){
 let p=products.find(x=>x.id===id);
 let d=document.getElementById("detail");
 d.classList.remove("hidden");
 d.innerHTML=`
 <button onclick="closeDetail()" class="mb-4 bg-gray-700 p-3 rounded">←戻る</button>
 ${p.img?`<img src="${p.img}" class="w-full rounded-xl mb-4">`:''}
 <h2 class="text-3xl font-bold">${p.name}</h2>
 <div class="text-green-400 text-3xl font-bold mt-2">¥${p.price}</div>
 <p class="mt-4">${p.desc||''}</p>
 <button onclick="buy(${p.id})" class="w-full mt-6 bg-blue-600 p-4 rounded-xl text-xl">購入</button>`;
}
function closeDetail(){detail.classList.add("hidden");}

function drawChart(){
 let c=document.getElementById("chart");
 let ctx=c.getContext("2d");
 ctx.clearRect(0,0,c.width,c.height);
 let vals=products.map(x=>x.sold).slice(0,8);
 if(!vals.length)return;
 let max=Math.max(...vals,1);
 vals.forEach((v,i)=>{
   let h=(v/max)*80;
   ctx.fillStyle="#60a5fa";
   ctx.fillRect(i*35+10,100-h,25,h);
 });
}

function render(){
 salesEl.textContent=sales;
 count.textContent=products.length;

 let q=(search.value||'').toLowerCase();
 let filtered=products.filter(x=>x.name.toLowerCase().includes(q));

 list.innerHTML='';
 filtered.forEach(p=>{
 list.innerHTML+=`
 <div class="card p-4">
 ${p.img?`<img src="${p.img}" class="w-full h-48 object-cover rounded-xl mb-3">`:''}
 <div class="text-xl font-bold">${p.name}</div>
 <div class="text-green-400 text-2xl font-bold">¥${p.price}</div>
 <div class="text-yellow-400">🔥${p.sold}件販売</div>
 <div class="grid grid-cols-2 gap-2 mt-3">
 <button onclick="showDetail(${p.id})" class="bg-gray-700 p-3 rounded">詳細</button>
 <button onclick="buy(${p.id})" class="bg-blue-600 p-3 rounded">購入</button>
 </div>
 </div>`;
 });

 ranking.innerHTML='';
 [...products].sort((a,b)=>b.sold-a.sold).slice(0,5).forEach((p,i)=>{
 ranking.innerHTML += `<div>${i+1}. ${p.name} (${p.sold}件)</div>`;
 });
 drawChart();
}
render();
</script>
</body>
</html>
