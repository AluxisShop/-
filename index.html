<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shop Dashboard Pro</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
  background:#0a0a0a;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

/* sidebar */
.sidebar{
  width:220px;
  background:rgba(255,255,255,0.05);
  border-right:1px solid rgba(255,255,255,0.08);
}

/* card */
.card{
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
}

/* button */
.btn:active{transform:scale(.97)}
</style>
</head>

<body class="flex">

<!-- LOGIN -->
<div id="login" class="fixed inset-0 flex items-center justify-center bg-black z-50">
  <div class="card p-6 w-80">
    <h1 class="font-bold mb-3">ADMIN LOGIN</h1>
    <input id="pass" type="password"
      class="w-full p-2 bg-black/50 rounded"
      placeholder="password">

    <button onclick="login()"
      class="w-full mt-3 bg-blue-600 p-2 rounded">
      ログイン
    </button>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar p-4 hidden md:block">
  <div class="text-xl font-bold mb-6">⚡ DASHBOARD</div>

  <div class="space-y-3 text-sm text-gray-300">
    <div>📊 概要</div>
    <div>🛒 商品管理</div>
    <div>💰 売上管理</div>
    <div>⚙ 設定</div>
  </div>

  <div class="mt-6 text-xs text-gray-500">
    Shop Pro v1.0
  </div>
</div>

<!-- MAIN -->
<div class="flex-1 p-4">

<!-- TOP STATS -->
<div class="grid grid-cols-3 gap-3 mb-4">

  <div class="card p-3">
    <div class="text-xs text-gray-400">売上</div>
    <div class="text-xl font-bold">¥<span id="sales">0</span></div>
  </div>

  <div class="card p-3">
    <div class="text-xs text-gray-400">商品数</div>
    <div class="text-xl font-bold" id="count">0</div>
  </div>

  <div class="card p-3">
    <div class="text-xs text-gray-400">販売数</div>
    <div class="text-xl font-bold" id="sold">0</div>
  </div>

</div>

<!-- ADD PRODUCT -->
<div class="card p-3 mb-4 grid grid-cols-2 gap-2">

  <input id="name" class="p-2 bg-black/40 rounded" placeholder="商品名">
  <input id="price" class="p-2 bg-black/40 rounded" placeholder="価格">

  <input id="img" class="p-2 bg-black/40 rounded col-span-2" placeholder="画像URL">
  <input id="video" class="p-2 bg-black/40 rounded col-span-2" placeholder="動画URL">

  <textarea id="desc"
    class="p-2 bg-black/40 rounded col-span-2"
    placeholder="説明"></textarea>

  <button onclick="add()"
    class="bg-blue-600 p-3 rounded col-span-2 btn">
    ＋商品追加
  </button>

</div>

<!-- PRODUCTS -->
<div id="list" class="grid md:grid-cols-3 gap-3"></div>

</div>

<script>

const ADMIN_PASS = "admin123";
let isAdmin = false;

function login(){
  const pass = document.getElementById("pass").value;

  if(pass === ADMIN_PASS){
    document.getElementById("login").style.display="none";
    isAdmin = true;
    render();
  } else {
    alert("パスワード違う");
  }
}

// DATA
let data = JSON.parse(localStorage.getItem("shop")||"[]");
let sales = Number(localStorage.getItem("sales")||0);

function save(){
  localStorage.setItem("shop",JSON.stringify(data));
  localStorage.setItem("sales",sales);
}

// ADD
function add(){

  const n = name.value;
  const p = Number(price.value||0);

  if(!n) return alert("商品名必須");

  data.unshift({
    id:Date.now(),
    name:n,
    price:p,
    img:img.value,
    video:video.value,
    desc:desc.value,
    sold:0
  });

  name.value=price.value=img.value=video.value=desc.value="";
  save();
  render();
}

// BUY
function buy(id){
  data = data.map(i=>{
    if(i.id===id){
      i.sold = (i.sold||0)+1;
      sales += i.price;
      window.open("https://buy.stripe.com/test_xxx","_blank");
    }
    return i;
  });

  save();
  render();
}

// DELETE
function del(id){
  if(!isAdmin) return alert("管理者のみ");
  data = data.filter(i=>i.id!==id);
  save();
  render();
}

// STATS
function calc(){
  document.getElementById("count").textContent = data.length;
  document.getElementById("sold").textContent =
    data.reduce((a,b)=>a+(b.sold||0),0);
}

// RENDER
function render(){

  calc();
  document.getElementById("sales").textContent = sales;

  const list = document.getElementById("list");

  list.innerHTML="";

  data
  .sort((a,b)=>(b.sold||0)-(a.sold||0))
  .forEach(i=>{

    list.innerHTML += `
      <div class="card p-3">

        ${i.img ? `
          <img src="${i.img}" class="h-40 w-full object-cover rounded mb-2">
        ` : ""}

        <div class="font-bold">${i.name}</div>
        <div class="text-gray-400">¥${i.price}</div>

        <div class="text-xs text-yellow-400 mt-1">
          🔥 ${i.sold||0} sold
        </div>

        <button onclick="buy(${i.id})"
          class="w-full mt-2 bg-blue-600 p-2 rounded">
          購入
        </button>

        ${isAdmin ? `
          <button onclick="del(${i.id})"
            class="w-full mt-2 text-red-400 text-xs">
            削除
          </button>
        ` : ""}

      </div>
    `;
  });
}

render();

</script>

</body>
</html>
