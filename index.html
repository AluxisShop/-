<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inventory Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-white min-h-screen">

<!-- ヘッダー -->
<div class="p-6 border-b border-gray-800 flex justify-between items-center">
  <h1 class="text-xl font-bold">📦 在庫ダッシュボード</h1>
  <button onclick="clearAll()" class="bg-red-600 px-3 py-1 rounded text-sm">全削除</button>
</div>

<!-- 入力エリア -->
<div class="p-6 grid md:grid-cols-4 gap-3">
  <input id="name" class="p-2 bg-gray-800 rounded" placeholder="アカウント名 / 商品名">
  <input id="price" class="p-2 bg-gray-800 rounded" placeholder="価格">
  <input id="note" class="p-2 bg-gray-800 rounded" placeholder="メモ">
  <button onclick="addItem()" class="bg-blue-600 rounded p-2">追加</button>
</div>

<!-- 在庫一覧 -->
<div class="p-6 grid md:grid-cols-3 gap-4" id="list"></div>

<script>
let data = JSON.parse(localStorage.getItem("inventory") || "[]");

function save() {
  localStorage.setItem("inventory", JSON.stringify(data));
  render();
}

function addItem() {
  const name = document.getElementById("name").value;
  const price = document.getElementById("price").value;
  const note = document.getElementById("note").value;

  if (!name) return alert("名前は必須");

  data.push({
    id: Date.now(),
    name,
    price,
    note
  });

  document.getElementById("name").value = "";
  document.getElementById("price").value = "";
  document.getElementById("note").value = "";

  save();
}

function deleteItem(id) {
  data = data.filter(i => i.id !== id);
  save();
}

function clearAll() {
  if (confirm("全部削除する？")) {
    data = [];
    save();
  }
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(item => {
    list.innerHTML += `
      <div class="bg-gray-900 p-4 rounded-xl border border-gray-800">
        <div class="font-bold text-lg">${item.name}</div>
        <div class="text-sm text-gray-400 mt-1">💰 ${item.price || "未設定"}</div>
        <div class="text-sm text-gray-400 mt-1">${item.note || ""}</div>

        <button onclick="deleteItem(${item.id})"
          class="mt-3 bg-red-500 px-3 py-1 rounded text-sm">
          削除
        </button>
      </div>
    `;
  });
}

render();
</script>

</body>
</html>
