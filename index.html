<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HNKG MARKET</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#070707;
overflow-x:hidden;
color:white;
min-height:100vh;
}

/* 背景 */

.bg{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
background:
radial-gradient(circle at 20% 20%,rgba(0,255,255,.12),transparent 30%),
radial-gradient(circle at 80% 40%,rgba(255,0,255,.12),transparent 30%),
radial-gradient(circle at 50% 80%,rgba(0,140,255,.12),transparent 30%);
animation:moveBg 10s infinite alternate;
z-index:-2;
}

@keyframes moveBg{
from{
transform:scale(1);
}
to{
transform:scale(1.2);
}
}

/* パーティクル */

.particle{
position:fixed;
width:3px;
height:3px;
background:white;
border-radius:50%;
opacity:.4;
animation:float 10s linear infinite;
}

@keyframes float{
from{
transform:translateY(100vh);
}
to{
transform:translateY(-100px);
}
}

/* Header */

header{
padding:40px 20px;
text-align:center;
}

.logo{
font-size:3rem;
font-weight:700;
letter-spacing:3px;
}

.logo span{
color:#00e1ff;
}

.sub{
opacity:.6;
margin-top:10px;
}

/* Stats */

.stats{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
padding:20px;
}

.stat{
width:150px;

background:rgba(255,255,255,.05);
backdrop-filter:blur(15px);

border:1px solid rgba(255,255,255,.08);

padding:18px;
border-radius:18px;
text-align:center;
}

.stat h2{
color:#00e1ff;
}

/* Game Select */

.section-title{
text-align:center;
font-size:1.7rem;
margin-top:30px;
margin-bottom:20px;
}

.games{
max-width:1200px;
margin:auto;
padding:20px;

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.game-card{

background:rgba(255,255,255,.05);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.08);

border-radius:25px;

padding:30px;

transition:.3s;

cursor:pointer;

position:relative;

overflow:hidden;
}

.game-card:hover{
transform:translateY(-10px);
border-color:#00e1ff;
box-shadow:0 0 35px rgba(0,225,255,.2);
}

.game-icon{
font-size:3rem;
margin-bottom:15px;
}

.game-name{
font-size:1.4rem;
font-weight:600;
}

.game-desc{
opacity:.6;
margin-top:10px;
font-size:.9rem;
}

/* Ranking */

.ranking{
max-width:1200px;
margin:50px auto;
padding:20px;
}

.rank-box{

background:rgba(255,255,255,.05);

backdrop-filter:blur(20px);

border-radius:25px;

padding:25px;
}

.rank-item{
display:flex;
justify-content:space-between;
padding:15px 0;
border-bottom:1px solid rgba(255,255,255,.05);
}

/* Footer */

footer{
padding:40px;
text-align:center;
opacity:.5;
}

.inventory-tools{
display:flex;
gap:15px;
justify-content:center;
padding:20px;
flex-wrap:wrap;
}

.search-box,
.filter-box{

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

color:white;

padding:15px;

border-radius:15px;

width:250px;
}

.inventory-grid{

max-width:1200px;

margin:auto;

padding:20px;

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(280px,1fr));

gap:25px;
}

.inventory-card{

background:rgba(255,255,255,.05);

backdrop-filter:blur(20px);

border-radius:20px;

padding:25px;

border:1px solid rgba(255,255,255,.08);

transition:.3s;
}

.inventory-card:hover{
transform:translateY(-10px);
}

.badge{

display:inline-block;

background:#00e1ff;

color:black;

padding:5px 12px;

border-radius:999px;

font-weight:bold;

margin-bottom:15px;
}

.price{

font-size:1.6rem;

font-weight:bold;

margin:15px 0;

color:#00e1ff;
}

.inventory-card button{

width:100%;

padding:14px;

border:none;

border-radius:15px;

background:#00e1ff;

font-weight:bold;

cursor:pointer;
}

.modal{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.8);

justify-content:center;

align-items:center;

z-index:999;
}

.modal-content{

width:90%;
max-width:500px;

background:#111;

padding:30px;

border-radius:25px;

position:relative;
}

.close{

position:absolute;

top:15px;
right:20px;

font-size:2rem;

cursor:pointer;
}

.price-large{

font-size:2rem;

margin:20px 0;

color:#00e1ff;
}

.buy-btn{

display:block;

text-align:center;

background:#00e1ff;

color:black;

padding:15px;

border-radius:15px;

text-decoration:none;

font-weight:bold;
}

.item-image{

width:100%;

height:180px;

object-fit:cover;

border-radius:15px;

margin-bottom:15px;

}

</style>
</head>

<body>

<div class="bg"></div>

<header>

<div class="logo">
HNKG <span>MARKET</span>
</div>

<div class="sub">
Premium Account Marketplace
</div>

</header>

<div class="stats">

<div class="stat">
<h2>128</h2>
<p>総在庫</p>
</div>

<div class="stat">
<h2>4892</h2>
<p>販売実績</p>
</div>

<div class="stat">
<h2>3分</h2>
<p>平均対応</p>
</div>

</div>

<h2 class="section-title">
🎮 ゲームを選択
</h2>

<div class="games">

<div class="game-card">
<div class="game-icon">⚔️</div>
<div class="game-name">ファンパレ</div>
<div class="game-desc">
限定キャラ・完凸多数
</div>
</div>

<div class="game-card">
<div class="game-icon">🏴‍☠️</div>
<div class="game-name">バウンティラッシュ</div>
<div class="game-desc">
超フェス・高スコア
</div>
</div>

<div class="game-card">
<div class="game-icon">🧸</div>
<div class="game-name">ツムツム</div>
<div class="game-desc">
コイン大量
</div>
</div>

<div class="game-card">
<div class="game-icon">🎲</div>
<div class="game-name">その他</div>
<div class="game-desc">
人気ゲーム多数
</div>
</div>

</div>

<div class="ranking">

<div class="rank-box">

<h2 style="margin-bottom:20px;">
🏆 人気ランキング
</h2>

<div class="rank-item">
<span>ファンパレ</span>
<span>1位</span>
</div>

<div class="rank-item">
<span>バウンティ</span>
<span>2位</span>
</div>

<div class="rank-item">
<span>ツムツム</span>
<span>3位</span>
</div>

</div>

</div>

<!-- INVENTORY -->

<section id="inventorySection" style="display:none;">

<h2 class="section-title">
📦 在庫一覧
</h2>

<div class="inventory-tools">

<input
type="text"
id="searchInput"
placeholder="商品を検索..."
class="search-box"
>

<select id="rankFilter" class="filter-box">
<option value="">全ランク</option>
<option value="S">S</option>
<option value="SS">SS</option>
<option value="SSS">SSS</option>
</select>

</div>

<div id="inventoryGrid" class="inventory-grid">

</div>

</section>

<!-- MODAL -->

<div id="itemModal" class="modal">

<div class="modal-content">

<span
class="close"
onclick="closeModal()"
>
×
</span>

<h2>
SSSランク
</h2>

<p>
石 3500個
</p>

<p>
限定キャラ15種
</p>

<p>
完凸キャラ5体
</p>

<div class="price-large">
¥7,980
</div>

<a
href="#"
class="buy-btn"
>
購入する
</a>

</div>

</div>

<footer>
© HNKG MARKET
</footer>

<script>
const inventory = [

{
id:1,
game:"ファンパレ",
rank:"44",
name:"限定7体",
price:"2000〜3000yen",
stone:"3500",
status:"販売中",
image:"https://jittery-tomato-jzhn6sum.edgeone.app/IMG_6035.png"
},

{
id:2,
game:"バウンティ",
rank:"SS",
name:"ニカルフィ所持",
price:"4980",
stone:"2200",
limited:"8",
views:2,
status:"販売中",
image:"https://picsum.photos/400/250?2"
}

];

for(let i=0;i<40;i++){

let p=document.createElement("div");

p.className="particle";

p.style.left=Math.random()*100+"%";

p.style.animationDuration=
(Math.random()*10+5)+"s";

p.style.opacity=Math.random();

document.body.appendChild(p);

}

// ゲーム押したら在庫表示

document
.querySelectorAll(".game-card")
.forEach(card=>{

card.onclick=()=>{

document
.getElementById("inventorySection")
.style.display="block";

window.scrollTo({
top:
document.getElementById(
"inventorySection"
).offsetTop,
behavior:"smooth"
});

};

});

// 検索

const searchInput=
document.getElementById("searchInput");

searchInput.addEventListener("input",()=>{

let value=
searchInput.value.toLowerCase();

document
.querySelectorAll(".inventory-card")
.forEach(card=>{

let name=
card.dataset.name.toLowerCase();

card.style.display=
name.includes(value)
?"block"
:"none";

});

});

// ランク絞り込み

document
.getElementById("rankFilter")
.addEventListener("change",e=>{

let rank=e.target.value;

document
.querySelectorAll(".inventory-card")
.forEach(card=>{

if(
rank===""
||
card.dataset.rank===rank
){

card.style.display="block";

}else{

card.style.display="none";

}

});

});

// モーダル

function openModal(id){

const item =
inventory.find(
i => i.id === id
);

document.querySelector(
"#itemModal h2"
).innerText =
item.rank + "ランク";

document.querySelector(
"#itemModal .price-large"
).innerText =
"¥" + item.price;

document.getElementById(
"itemModal"
).style.display =
"flex";

}

function closeModal(){

document
.getElementById("itemModal")
.style.display="none";

}

function renderInventory(){

const grid =
document.getElementById(
"inventoryGrid"
);

grid.innerHTML="";

inventory.forEach(item=>{

grid.innerHTML += `

<div class="inventory-card">

<img
src="${item.image}"
class="item-image"
>

<div class="badge">
${item.rank}
</div>

<h3>${item.name}</h3>

<p>${item.game}</p>

<div class="status">
● ${item.status}
</div>

<div class="viewer">

👁 ${item.views}人閲覧中

</div>

<div class="price">

¥${item.price}

</div>

<button onclick="openModal(${item.id})">

詳細を見る

</button>

</div>

`;

});

}

renderInventory();

document.querySelector(
".stats"
).innerHTML = `
<div class="stat">
<h2>${inventory.length}</h2>
<p>総在庫</p>
</div>

<div class="stat">
<h2>4892</h2>
<p>販売実績</p>
</div>

<div class="stat">
<h2>3分</h2>
<p>平均対応</p>
</div>
`;

</script>

</body>
</html>
